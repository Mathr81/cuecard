services:
  app:
    build: .
    image: cuecard:latest
    container_name: cuecard
    restart: unless-stopped

    # Les clés d'API viennent du .env ; sans lui l'app démarre quand même et
    # chaque écran dit précisément laquelle manque.
    env_file:
      - path: .env
        required: false

    volumes:
      # Historique, cache des sous-titres, décalages et carnet de vocabulaire.
      - ./data:/data

    # Aucun port publié : Nginx Proxy Manager joint le conteneur par son nom
    # sur le réseau partagé, et rien n'est exposé sur l'hôte. Dans NPM :
    # Forward Hostname = cuecard, Forward Port = 3000.
    # Pour y accéder en direct (essai local, débogage), décommente :
    # ports:
    #   - '127.0.0.1:3000:3000'

    networks:
      - proxy

    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  proxy:
    # Le réseau de Nginx Proxy Manager, créé par sa propre stack.
    # `docker network ls` donne son nom exact ; renseigne-le dans .env.
    name: ${CUECARD_NETWORK:-npm}
    external: true
